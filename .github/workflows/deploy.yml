name: Test & Deploy to GitHub Pages

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backyard-league/package-lock.json
            unicorn/package-lock.json
      - run: npm ci --omit=optional
      - run: npm test
      - run: npm run build
      # Site layout: Recess Rivals is the main page, French Fried lives at /french-fried/.
      - name: Build Recess Rivals
        working-directory: backyard-league
        run: |
          npm ci --omit=optional
          npm test
          npm run build
      - name: Build Unicorn
        working-directory: unicorn
        run: |
          npm ci --omit=optional
          npm run typecheck
          npm test
          npm run build
      - name: Assemble site
        run: |
          mkdir -p site/french-fried site/recess-rivals site/unicorn
          cp -r unicorn/dist/. site/unicorn/
          cp dist/index.html dist/embed.html site/french-fried/
          cp backyard-league/dist/index.html site/index.html
          cp backyard-league/dist/index.html site/recess-rivals/index.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
