name: Desktop builds (Steam-ready)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: french-fried-${{ matrix.os }}
          path: |
            release/*-unpacked/**
            release/mac*/**
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: warn
