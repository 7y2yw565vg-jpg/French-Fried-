name: Every Possible Book desktop builds (Steam-ready)

on:
  workflow_dispatch:
  push:
    tags: ['epb-v*']

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: every-possible-book
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: every-possible-book/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: every-possible-book-${{ matrix.os }}
          path: |
            every-possible-book/release/*-unpacked/**
            every-possible-book/release/mac*/**
            every-possible-book/release/*.exe
            every-possible-book/release/*.dmg
            every-possible-book/release/*.AppImage
          if-no-files-found: warn
